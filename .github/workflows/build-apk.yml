name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Add Android Platform with Capacitor
        run: |
          npx cap add android || true
          npx cap sync android || true

      - name: Build Android APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Copy Generated APK to Root
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ./LM-Chat-AI-v4.2.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LM-Chat-AI-Android-APK
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            ./LM-Chat-AI-v4.2.apk

      - name: Create GitHub Release (Optional for Tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: LM-Chat-AI-v4.2.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
